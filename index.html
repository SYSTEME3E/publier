<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publier</title>
<style>
  :root { --bg:#fff; --fg:#111; --blue:#2f80ff; --blue-deep:#1257e0; --yellow:#ffd400; --white:#fff; --dim:#5b6575; --line:#cfd5df; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.9rem; margin:0 0 16px; color:var(--blue); letter-spacing:.3px; }
  .box { background:var(--bg); border:0; padding:12px 0; margin-bottom:8px; }
  label.title { display:block; font-weight:700; margin-bottom:8px; color:var(--blue-deep); }

  /* Zone de choix du fichier */
  .drop { padding:12px 0; }
  .drop .hint { margin:0 0 12px; color:var(--fg); }
  .drop .hint small { color:var(--dim); }
  input[type=file] { width:100%; color:var(--fg); font:inherit; }
  input[type=file]::file-selector-button { background:var(--yellow); color:#000; font:inherit; font-weight:800; border:2px solid var(--yellow); border-radius:8px; padding:10px 18px; margin-right:12px; cursor:pointer; }
  input[type=file]::file-selector-button:hover { background:var(--blue); border-color:var(--blue); color:var(--white); }

  input[type=password], textarea { width:100%; padding:10px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  textarea { min-height:140px; resize:vertical; }
  ::placeholder { color:var(--dim); }
  #preview, #vpreview { max-width:100%; max-height:260px; margin-top:12px; border-radius:6px; display:none; }
  .net { display:flex; align-items:center; gap:8px; padding:4px 0; color:var(--fg); }
  .net small { color:var(--dim); }
  input[type=checkbox] { accent-color:var(--blue); width:18px; height:18px; }
  button { width:100%; padding:14px; font:inherit; font-weight:800; font-size:1.05rem; color:var(--white); background:var(--blue-deep); border:2px solid var(--blue); border-radius:8px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--yellow); border-color:var(--yellow); color:#000; }
  button:disabled { opacity:.5; cursor:wait; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  #bar { height:8px; background:#e3e9f5; border-radius:4px; margin-top:12px; overflow:hidden; display:none; }
  #bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .15s; }
  #status { margin-top:12px; min-height:1.5em; }
  .ok { color:var(--blue-deep); font-weight:700; }
  .err { color:#c62828; font-weight:700; }
  .err::before { content:"⚠ "; }
  a { color:var(--blue-deep); }
  @media (prefers-reduced-motion: reduce) { #bar i { transition:none; } }

  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.3rem; }
  #burger { width:44px; height:44px; padding:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; background:var(--bg); border:2px solid var(--blue); }
  #burger i { display:block; width:22px; height:3px; background:var(--blue-deep); border-radius:2px; }
  #burger:hover:not(:disabled) { background:var(--yellow); border-color:var(--yellow); }
  #drawer { position:fixed; inset:0 auto 0 0; width:260px; max-width:80vw; background:var(--bg); border-right:1px solid var(--line); transform:translateX(-100%); transition:transform .2s; z-index:20; padding:16px 0; }
  #drawer.open { transform:none; }
  #drawer b { display:block; padding:0 20px 12px; color:var(--blue); font-size:1.3rem; }
  #drawer a { display:block; padding:14px 20px; color:var(--fg); text-decoration:none; font-weight:600; }
  #drawer a.on { background:var(--blue-deep); color:#fff; }
  #veil { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:10; display:none; }
  #veil.open { display:block; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .kpi { border:1px solid var(--line); border-radius:8px; padding:12px; }
  .kpi small { color:var(--dim); display:block; } .kpi strong { font-size:1.5rem; color:var(--blue-deep); }
  .up { color:#1b7f3b; font-weight:700; } .down { color:#c62828; font-weight:700; }
  h2 { font-size:1.1rem; margin:20px 0 8px; color:var(--blue-deep); }
  .alert { background:#f3f7ff; padding:10px 12px; border-radius:6px; margin-bottom:8px; }
  .alert.danger { background:#fdeeee; } .alert.warn { background:#fff9db; } .alert.ok { background:#eefaf1; }
  .alert b { display:block; } .alert.ok, .alert.ok b { color:var(--fg); font-weight:400; } .alert.ok b { font-weight:700; } .alert a { font-weight:700; }
  .item { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .item.neg { border-color:#c62828; } .item p { margin:4px 0 8px; white-space:pre-wrap; word-break:break-word; }
  .meta { color:var(--dim); font-size:.85rem; }
  .tag { display:inline-block; font-size:.75rem; font-weight:700; padding:1px 8px; border-radius:10px; background:#e3e9f5; margin-right:4px; }
  .tag.r { background:#fdeeee; color:#c62828; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; } .acts button, .item input { width:auto; padding:8px 12px; font-size:.9rem; }
  .item input[type=text] { flex:1 1 100%; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .sec { background:var(--bg); color:var(--blue-deep); } .dng { background:#c62828; border-color:#c62828; }
  .m { display:block; width:100%; max-height:320px; object-fit:contain; background:#000; border-radius:6px; margin:8px 0; }
  canvas { width:100%; height:90px; display:block; }
  .view { display:none; } .view.on { display:block; }
</style>
</head>
<body>
<header><button id="burger" aria-label="Menu"><i></i><i></i><i></i></button><h1 id="ttl">Accueil</h1></header>
<div id="veil"></div>
<nav id="drawer"><b>Publier</b>
  <a href="#home">📊 Accueil</a><a href="#publish">✏️ Publier</a><a href="#posts">📰 Publications</a><a href="#comments">💬 Commentaires</a><a href="#ads">📣 Publicité</a><a href="#history">🕘 Historique</a><a href="/analyser.html">🔎 Analyser</a>
</nav>
<main>
<section class="view" id="v-home"><div id="home-c">Chargement…</div></section>
<section class="view" id="v-posts"><div id="posts-c">Chargement…</div></section>
<section class="view" id="v-comments"><div id="comments-c">Chargement…</div></section>
<section class="view" id="v-ads"><div id="ads-c">Chargement…</div></section>
<section class="view" id="v-history"><div id="history-c">Chargement…</div></section>
<section class="view" id="v-publish">

  <div class="box drop">
    <label class="title" for="file">Image ou vidéo</label>
    <p class="hint">Choisis le fichier à publier. <small>Image ou vidéo, 50 Mo maximum.</small></p>
    <input id="file" type="file" accept="image/*,video/*">
    <img id="preview" alt="">
    <video id="vpreview" controls></video>
    <div id="bar"><i></i></div>
  </div>

  <div class="box">
    <label class="title" for="text">Texte</label>
    <textarea id="text" placeholder="Écris ta publication…"></textarea>
  </div>

  <div class="box">
    <div class="net"><input id="fb" type="checkbox" checked> <label for="fb">Page Facebook</label></div>
    <div class="net"><input id="yt" type="checkbox"> <label for="yt">YouTube <small>(vidéo, envoyée en privé)</small></label></div>
    <div class="net"><input id="tt" type="checkbox" disabled> <label for="tt">TikTok <small>(pas encore branché)</small></label></div>
  </div>

  <div class="box">
    <label class="title" for="pwd">Mot de passe</label>
    <input id="pwd" type="password" autocomplete="current-password" placeholder="Mot de passe de l’application">
  </div>

  <button id="go">Publier</button>
  <div id="status" role="status"></div>
</section>
</main>

<footer style="text-align:center;padding:24px 12px;font-size:13px;opacity:.7"><a href="/confidentialite.html">Politique de confidentialité</a> · <a href="/conditions.html">Conditions d'utilisation</a></footer>
<script>
const SUPABASE_URL = 'https://vxefmhkoojbjxtczjujo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_T_aNobx9dQA29cdoF4pWtA_rM2lNiA2'; // clé publique, faite pour être dans le navigateur
const BUCKET = 'media';

const $ = (id) => document.getElementById(id);
const file = $('file'), text = $('text'), go = $('go'), status = $('status'), pwd = $('pwd'), bar = $('bar');

try { pwd.value = localStorage.getItem('pwd') || ''; } catch {}

file.addEventListener('change', () => {
  const f = file.files[0];
  $('preview').style.display = 'none';
  $('vpreview').style.display = 'none';
  if (!f) return;
  const el = f.type.startsWith('video/') ? $('vpreview') : $('preview');
  el.src = URL.createObjectURL(f);
  el.style.display = 'block';
});

function show(msg, cls, link) {
  status.className = cls || '';
  status.textContent = msg;
  if (link) {
    const a = document.createElement('a');
    a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = ' Voir la publication';
    status.appendChild(a);
  }
}

// Envoi direct du fichier vers Supabase Storage (avec progression)
function upload(f) {
  return new Promise((resolve, reject) => {
    const ext = (f.name.split('.').pop() || 'bin').replace(/[^a-z0-9]/gi, '').toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
    xhr.setRequestHeader('Content-Type', f.type);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) bar.firstElementChild.style.width = Math.round((e.loaded / e.total) * 100) + '%';
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`);
      else {
        let m = 'Échec de l’envoi du fichier.';
        try { const j = JSON.parse(xhr.responseText); if (/exceeded|too large|size/i.test(j.message || '')) m = 'Fichier trop lourd (50 Mo maximum).'; } catch {}
        reject(new Error(m));
      }
    };
    xhr.onerror = () => reject(new Error('Connexion perdue pendant l’envoi du fichier.'));
    xhr.send(f);
  });
}

go.addEventListener('click', async () => {
  if (!$('fb').checked && !$('yt').checked) return show('Coche au moins un réseau.', 'err');
  const f = file.files[0];
  if (!f && !text.value.trim()) return show('Écris un texte ou ajoute un fichier.', 'err');
  if (!pwd.value) return show('Entre le mot de passe.', 'err');
  if ($('yt').checked && !(f && f.type.startsWith('video/'))) return show('YouTube demande une vidéo.', 'err');
  go.disabled = true;
  try {
    let mediaUrl = null, mediaType = 'text';
    if (f) {
      mediaType = f.type.startsWith('video/') ? 'video' : f.type.startsWith('image/') ? 'image' : null;
      if (!mediaType) throw new Error('Format non pris en charge : utilise une image ou une vidéo.');
      if (f.size > 50 * 1024 * 1024) throw new Error('Fichier trop lourd (50 Mo maximum).');
      show('Envoi du fichier…');
      bar.style.display = 'block'; bar.firstElementChild.style.width = '0';
      mediaUrl = await upload(f);
    }
    let fbId = null, ytId = null;
    if ($('fb').checked) {
      show('Publication sur Facebook…');
      const res = await fetch('/api/publish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd.value, message: text.value, mediaUrl, mediaType }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Échec de la publication.');
      fbId = data.id;
    }
    try { localStorage.setItem('pwd', pwd.value); } catch {}
    if ($('yt').checked) {
      show('Envoi sur YouTube…');
      const r = await fetch('/api/youtube', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-password': pwd.value },
        body: JSON.stringify({ mediaUrl, title: text.value, description: text.value }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error((fbId ? 'Facebook : publié. ' : '') + 'YouTube : ' + (d.error || 'échec.'));
      ytId = d.id;
    }
    show(fbId && ytId ? 'Publié sur Facebook. Vidéo envoyée sur YouTube (privée).' : ytId ? 'Vidéo envoyée sur YouTube (privée).' : 'Publié sur ta Page.', 'ok',
      fbId ? 'https://www.facebook.com/' + fbId : 'https://studio.youtube.com/video/' + ytId + '/edit');
    statsCache = null; text.value = ''; file.value = '';
    $('preview').style.display = 'none'; $('vpreview').style.display = 'none';
  } catch (e) {
    show(e.message, 'err');
  } finally {
    bar.style.display = 'none';
    go.disabled = false;
  }
});

// ===== Navigation =====
const TITLES = { home:'Accueil', publish:'Publier', posts:'Publications', comments:'Commentaires', ads:'Publicité', history:'Historique' };
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmt = (n) => n == null ? '–' : Number(n).toLocaleString('fr-FR');
const ago = (d) => new Date(d).toLocaleDateString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const delta = (d) => d == null ? '' : `<span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)} %</span>`;
const toggle = (o) => { $('drawer').classList.toggle('open', o); $('veil').classList.toggle('open', o); };
$('burger').onclick = () => toggle(true); $('veil').onclick = () => toggle(false);

function pw() { return pwd.value || localStorage.getItem('pwd') || ''; }
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'x-password': pw(), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erreur.');
  return d;
}
const fail = (el, e) => { el.innerHTML = `<p class="err">${esc(e.message)}</p>`; };

const loaders = { home: loadHome, posts: loadPosts, comments: loadComments, ads: loadAds, history: loadHistory };
function route() {
  const r = (location.hash || '#home').slice(1); const name = TITLES[r] ? r : 'home';
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === 'v-' + name));
  document.querySelectorAll('#drawer a').forEach((a) => a.classList.toggle('on', a.hash === '#' + name));
  $('ttl').textContent = TITLES[name]; toggle(false);
  loaders[name]?.();
}
window.addEventListener('hashchange', route);
pwd.addEventListener('change', () => { try { localStorage.setItem('pwd', pwd.value); } catch {} });

// ===== Accueil =====
let statsCache = null;
async function getStats() { return statsCache = await api('/api/stats'); }
async function loadHome() {
  const el = $('home-c');
  if (!pw()) { el.innerHTML = '<p>Entre d’abord le mot de passe dans <a href="#publish">Publier</a>.</p>'; return; }
  el.textContent = 'Chargement…';
  try {
    const s = await getStats(), k = s.kpis;
    el.innerHTML = `<h2>${esc(s.page.name)}</h2>
    <div class="kpis">
      <div class="kpi"><small>Abonnés</small><strong>${fmt(s.page.followers)}</strong><br><small>${k.follows >= 0 ? '+' : ''}${k.follows} cette semaine</small></div>
      <div class="kpi"><small>Vues (7 j)</small><strong>${fmt(k.views)}</strong><br>${delta(k.viewsDelta)}</div>
      <div class="kpi"><small>Interactions (7 j)</small><strong>${fmt(k.engagement)}</strong><br>${delta(k.engagementDelta)}</div>
      <div class="kpi"><small>Publications suivies</small><strong>${s.posts.length}</strong></div>
    </div>
    <h2>Alertes</h2>${s.alerts.map((a) => `<div class="alert ${a.level}"><b>${esc(a.title)}</b>${esc(a.text)}${a.go ? ` <a href="${a.go}">Ouvrir</a>` : ''}</div>`).join('')}
    <h2>Vues par jour</h2><canvas id="cv"></canvas>`;
    spark($('cv'), s.daily);
  } catch (e) { fail(el, e); }
}
function spark(c, v) {
  if (!v.length) { c.replaceWith(Object.assign(document.createElement('p'), { textContent: 'Pas de données.' })); return; }
  const w = c.width = c.clientWidth * 2, h = c.height = 180, x = c.getContext('2d'), m = Math.max(...v, 1);
  x.strokeStyle = '#1257e0'; x.lineWidth = 4; x.beginPath();
  v.forEach((y, i) => { const px = (i / Math.max(v.length - 1, 1)) * (w - 20) + 10, py = h - 10 - (y / m) * (h - 20); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
}

// ===== Publications =====
function media(video, image, link) {
  if (video) return `<video src="${esc(video)}" ${image ? `poster="${esc(image)}"` : ''} controls preload="none" playsinline class="m"></video>`;
  if (image) return `<img src="${esc(image)}" alt="" loading="lazy" class="m">`;
  return '';
}
async function loadPosts() {
  const el = $('posts-c'); if (!pw()) { el.textContent = 'Entre d’abord le mot de passe dans Publier.'; return; }
  try {
    const s = statsCache || await getStats(), vs = s.posts.map((p) => p.views).filter((v) => v != null).sort((a, b) => a - b), med = vs[Math.floor(vs.length / 2)] || 0;
    el.innerHTML = s.posts.map((p) => `<div class="item"><span class="meta">${ago(p.created)}</span>${p.views != null && p.views < med * 0.4 ? ' <span class="tag r">Peu de visibilité</span>' : ''}
      ${media(p.video, p.image, p.url)}
      <p>${esc(p.message.slice(0, 160)) || '<i>(sans texte)</i>'}</p>
      <span class="tag">👁 ${fmt(p.views)}</span><span class="tag">👍 ${p.reactions}</span><span class="tag">💬 ${p.comments}</span><span class="tag">↗ ${p.shares}</span>
      <a href="${esc(p.url)}" target="_blank" rel="noopener">Voir</a></div>`).join('') || 'Aucune publication.';
  } catch (e) { fail(el, e); }
}

// ===== Commentaires =====
async function loadComments() {
  const el = $('comments-c'); if (!pw()) { el.textContent = 'Entre d’abord le mot de passe dans Publier.'; return; }
  try {
    const { comments, scanned } = await api('/api/comments');
    el.innerHTML = comments.map((c) => `<div class="item ${c.negative ? 'neg' : ''}" data-id="${esc(c.id)}">
      <b>${esc(c.from)}</b> <span class="meta">${ago(c.created)}</span>
      ${c.mine ? '<span class="tag">Ta Page</span>' : ''}${c.negative ? '<span class="tag r">Négatif</span>' : ''}${c.replied ? '<span class="tag">Répondu</span>' : ''}${c.hidden ? '<span class="tag">Masqué</span>' : ''}
      <p>${esc(c.message)}</p>
      <div class="acts"><input type="text" placeholder="Ta réponse…"><button data-a="reply">Répondre</button>
      <button class="sec" data-a="hide">Masquer</button><button class="dng" data-a="delete">Supprimer</button></div></div>`).join('') || 'Aucun commentaire récent.';
  } catch (e) { fail(el, e); }
}
$('comments-c').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const box = b.closest('.item'), a = b.dataset.a;
  if (a === 'delete' && !confirm('Supprimer ce commentaire ?')) return;
  b.disabled = true;
  try { await api('/api/comments', { action: a, id: box.dataset.id, message: box.querySelector('input').value }); statsCache = null; loadComments(); }
  catch (er) { alert(er.message); b.disabled = false; }
});

// ===== Historique =====
async function loadHistory() {
  const el = $('history-c'); if (!pw()) { el.textContent = 'Entre d’abord le mot de passe dans Publier.'; return; }
  try {
    const { items } = await api('/api/history');
    el.innerHTML = items.map((i) => `<div class="item"><span class="meta">${ago(i.created_at)}</span> <span class="tag ${i.status === 'ok' ? '' : 'r'}">${i.status === 'ok' ? 'Publié' : 'Échec'}</span><span class="tag">${esc(i.media_type)}</span>
      ${i.media_url ? media(i.media_type === 'video' ? i.media_url : null, i.media_type === 'image' ? i.media_url : null) : ''}
      <p>${esc((i.message || '').slice(0, 160))}</p>${i.error ? `<span class="err">${esc(i.error)}</span>` : ''}</div>`).join('') || 'Aucune publication enregistrée.';
  } catch (e) { fail(el, e); }
}
// ===== Publicité =====
const STAT = { ACTIVE:'Active', PAUSED:'En pause', PENDING_REVIEW:'En vérification', DISAPPROVED:'Refusée', WITH_ISSUES:'Problème' };
async function loadAds() {
  const el = $('ads-c'); if (!pw()) { el.textContent = 'Entre d’abord le mot de passe dans Publier.'; return; }
  try {
    const [a, s] = await Promise.all([api('/api/ads'), statsCache || getStats()]), t = a.total, cur = a.account.currency;
    el.innerHTML = `<div class="kpis">
      <div class="kpi"><small>Dépense (7 j)</small><strong>${fmt(t.spend || 0)}</strong><br><small>${esc(cur)}</small></div>
      <div class="kpi"><small>Portée (7 j)</small><strong>${fmt(t.reach || 0)}</strong></div>
      <div class="kpi"><small>Impressions</small><strong>${fmt(t.impressions || 0)}</strong></div>
      <div class="kpi"><small>Clics</small><strong>${fmt(t.clicks || 0)}</strong></div></div>
    <h2>Booster une publication</h2><div class="item">
      <select id="b-post" style="width:100%;padding:10px;font:inherit">${s.posts.map((p) => `<option value="${esc(p.id)}">${esc(ago(p.created))} — ${esc((p.message || '(média)').slice(0, 40))}</option>`).join('')}</select>
      <p class="meta">Budget par jour (${esc(cur)}), maximum ${a.max}</p><input id="b-bud" type="number" min="1" max="${a.max}" value="${Math.min(a.max, 2)}" style="width:100%">
      <p class="meta">Durée en jours (1 à 30)</p><input id="b-days" type="number" min="1" max="30" value="3" style="width:100%">
      <p class="meta">Pays (codes séparés par des virgules, ex : FR, CI, SN)</p><input id="b-cty" type="text" value="FR" style="width:100%">
      <p></p><button id="b-go">🚀 Booster</button><div id="b-st" role="status"></div></div>
    <h2>Campagnes</h2>${a.campaigns.map((c) => { const i = c.insights?.data?.[0] || {}, on = c.effective_status === 'ACTIVE';
      return `<div class="item"><b>${esc(c.name)}</b> <span class="tag ${on ? '' : 'r'}">${esc(STAT[c.effective_status] || c.effective_status)}</span>
      <p class="meta">Dépensé : ${fmt(i.spend || 0)} ${esc(cur)} · Portée : ${fmt(i.reach || 0)} · Clics : ${fmt(i.clicks || 0)}</p>
      <div class="acts"><button class="${on ? 'sec' : ''}" data-id="${esc(c.id)}" data-s="${on ? 'PAUSED' : 'ACTIVE'}">${on ? 'Mettre en pause' : 'Activer'}</button></div></div>`; }).join('') || '<p>Aucune campagne.</p>'}`;
    $('b-go').onclick = async () => {
      const bud = $('b-bud').value, d = $('b-days').value, c = $('b-cty').value, st = $('b-st');
      if (!confirm(`Dépenser jusqu’à ${bud * d} ${cur} (${bud} ${cur}/jour pendant ${d} jour(s)) pour booster cette publication ?`)) return;
      $('b-go').disabled = true; st.textContent = 'Création de la campagne…';
      try { await api('/api/ads', { action: 'boost', postId: $('b-post').value, dailyBudget: bud, days: d, countries: c }); loadAds(); }
      catch (e) { st.className = 'err'; st.textContent = e.message; $('b-go').disabled = false; }
    };
  } catch (e) { fail(el, e); }
}
$('ads-c').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-id]'); if (!b) return; b.disabled = true;
  try { await api('/api/ads', { action: 'status', id: b.dataset.id, status: b.dataset.s }); loadAds(); } catch (er) { alert(er.message); b.disabled = false; }
});
route();

</script>
</body>
</html>
