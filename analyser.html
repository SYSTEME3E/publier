<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyser</title>
<style>
  :root { --bg:#fff; --fg:#111; --blue:#2f80ff; --blue-deep:#1257e0; --yellow:#ffd400; --dim:#5b6575; --line:#cfd5df; --ok:#1b7f3b; --warn:#a15c00; --bad:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.3rem; color:var(--blue); }
  header a { color:var(--blue-deep); font-weight:700; text-decoration:none; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  label.title { display:block; font-weight:700; margin:16px 0 8px; color:var(--blue-deep); }
  input[type=file] { width:100%; font:inherit; }
  input[type=file]::file-selector-button { background:var(--yellow); color:#000; font:inherit; font-weight:800; border:2px solid var(--yellow); border-radius:8px; padding:10px 18px; margin-right:12px; cursor:pointer; }
  textarea { width:100%; min-height:110px; padding:10px; font:inherit; border:1px solid var(--line); border-radius:6px; resize:vertical; }
  video#pv { display:none; width:100%; max-height:260px; margin-top:12px; border-radius:6px; background:#000; }
  button { width:100%; margin-top:16px; padding:14px; font:inherit; font-weight:800; font-size:1.05rem; color:#fff; background:var(--blue-deep); border:2px solid var(--blue); border-radius:8px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--yellow); border-color:var(--yellow); color:#000; }
  button:disabled { opacity:.5; cursor:wait; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  .score { text-align:center; margin:24px 0 8px; }
  .score strong { font-size:3rem; color:var(--blue-deep); line-height:1; }
  .score span { display:block; font-weight:700; }
  .meter { height:10px; background:#e3e9f5; border-radius:5px; overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--blue); }
  h2 { font-size:1.1rem; margin:24px 0 8px; color:var(--blue-deep); }
  .row { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .row b { display:block; }
  .row.ok b { color:var(--ok); } .row.warn b { color:var(--warn); } .row.bad b { color:var(--bad); } .row.info b { color:var(--dim); }
  .row.bad { border-color:var(--bad); }
  .meta { color:var(--dim); font-size:.9rem; }
  .err { color:var(--bad); font-weight:700; }
  a.go { display:block; margin-top:16px; text-align:center; font-weight:800; color:var(--blue-deep); }
</style>
</head>
<body>
<header><a href="/">← Site</a><h1>Analyser</h1></header>
<main>
  <p class="meta">Contrôle ta vidéo avant de la publier. L’analyse se fait dans ton navigateur : la vidéo n’est envoyée nulle part.</p>

  <label class="title" for="file">Vidéo</label>
  <input id="file" type="file" accept="video/*">
  <video id="pv" controls playsinline></video>

  <label class="title" for="cap">Texte de la publication (facultatif)</label>
  <textarea id="cap" placeholder="Colle ici le texte et les hashtags prévus…"></textarea>

  <button id="go">Analyser</button>
  <div id="out" role="status"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const file = $('file'), cap = $('cap'), go = $('go'), out = $('out');
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const avg = (a) => a.reduce((s, x) => s + x, 0) / (a.length || 1);

file.addEventListener('change', () => {
  const f = file.files[0], v = $('pv');
  if (!f) { v.style.display = 'none'; return; }
  v.src = URL.createObjectURL(f); v.style.display = 'block';
});

function loadVideo(f) {
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = URL.createObjectURL(f);
    v.onloadeddata = () => res(v);
    v.onerror = () => rej(new Error('Ton navigateur ne peut pas lire cette vidéo. Essaie un fichier MP4.'));
  });
}
function seek(v, t) {
  return new Promise((r) => {
    const h = () => { v.removeEventListener('seeked', h); r(); };
    v.addEventListener('seeked', h);
    v.currentTime = Math.min(Math.max(t, 0), Math.max(v.duration - 0.05, 0));
  });
}
const cv = document.createElement('canvas'); cv.width = cv.height = 48;
const cx = cv.getContext('2d', { willReadFrequently: true });
const grab = (v) => { cx.drawImage(v, 0, 0, 48, 48); return cx.getImageData(0, 0, 48, 48).data; };
const lum = (d) => { let s = 0; for (let i = 0; i < d.length; i += 4) s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; return s / (d.length / 4); };
const diff = (a, b) => { let s = 0; for (let i = 0; i < a.length; i += 4) s += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]); return s / (a.length / 4) / 3; };

async function audioLevel(f) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await f.arrayBuffer());
    const d = buf.getChannelData(0), step = Math.max(1, Math.floor(d.length / 200000));
    let s = 0, n = 0; for (let i = 0; i < d.length; i += step) { s += d[i] * d[i]; n++; }
    ctx.close(); return Math.sqrt(s / n);
  } catch { return null; }
}

async function analyse(f, caption) {
  const v = await loadVideo(f), dur = v.duration, w = v.videoWidth, h = v.videoHeight, ratio = w / h;
  const lums = [];
  for (const p of [.1, .3, .5, .7, .9]) { await seek(v, p * dur); lums.push(lum(grab(v))); }
  const hook = [];
  for (const t of [0.1, 1, 2, Math.min(3, dur - 0.1)]) { await seek(v, t); hook.push(Array.from(grab(v))); }
  const motion = avg(hook.slice(1).map((d, i) => diff(hook[i], d)));
  const firstLum = lum(hook[0]), bright = avg(lums);
  const level = await audioLevel(f);
  const noTrack = v.audioTracks && v.audioTracks.length === 0;

  const c = []; // { st, t, d, pen }
  const add = (st, t, d, pen = 0) => c.push({ st, t, d, pen });

  // Format
  if (ratio >= 0.5 && ratio <= 0.62) add('ok', 'Format vertical 9:16', `${w}×${h} : idéal pour TikTok, Reels et mobile.`);
  else if (ratio > 0.62 && ratio <= 1.1) add('warn', 'Format presque carré', `${w}×${h} : correct sur Facebook, mais le vertical 9:16 est plus visible sur mobile.`, 8);
  else if (ratio > 1.1) add('warn', 'Format horizontal', `${w}×${h} : sur mobile la vidéo sera petite ou coupée. Recadre-la en vertical.`, 12);
  else add('warn', 'Format très étroit', `${w}×${h} : plus étroit que 9:16, des bords peuvent être coupés.`, 4);

  // Résolution
  const side = Math.min(w, h);
  if (side >= 720) add('ok', 'Résolution suffisante', `${side} px sur le plus petit côté.`);
  else if (side >= 540) add('warn', 'Résolution moyenne', `${side} px : vise 720 px ou plus pour une image nette.`, 6);
  else add('bad', 'Résolution trop basse', `${side} px : l’image sera floue. Exporte en 720 px ou plus.`, 14);

  // Durée
  const ds = Math.round(dur);
  if (dur >= 7 && dur <= 60) add('ok', 'Durée adaptée', `${ds} s : bonne longueur pour garder les spectateurs.`);
  else if (dur < 7) add('warn', 'Vidéo très courte', `${ds} s : peu de temps pour faire passer ton message (sauf vidéo en boucle).`, 5);
  else if (dur <= 90) add('warn', 'Vidéo un peu longue', `${ds} s : l’attention baisse. Garde l’essentiel sous 60 s si possible.`, 5);
  else add('warn', 'Vidéo longue', `${ds} s : beaucoup de gens quittent avant la fin. Coupe ou découpe en plusieurs vidéos.`, 10);

  // Poids
  const mo = f.size / 1048576;
  if (mo > 50) add('bad', 'Fichier trop lourd pour le site', `${mo.toFixed(1)} Mo : la limite est de 50 Mo. Compresse la vidéo.`, 20);
  else add('ok', 'Poids correct', `${mo.toFixed(1)} Mo (limite : 50 Mo).`);

  // Luminosité
  if (bright < 60) add('bad', 'Vidéo très sombre', 'On distingue mal l’image. Éclaire davantage ou augmente la luminosité.', 15);
  else if (bright < 85) add('warn', 'Vidéo plutôt sombre', 'Une image plus lumineuse retient mieux l’attention.', 7);
  else if (bright > 215) add('warn', 'Vidéo trop claire', 'Les détails risquent de disparaître. Baisse l’exposition.', 6);
  else add('ok', 'Luminosité correcte', 'L’image est bien visible.');

  // Accroche (estimation)
  if (firstLum < 20) add('warn', 'Début noir', 'Le premier plan est presque noir. Commence directement par l’action.', 8);
  else if (motion < 3) add('warn', 'Début peu dynamique', 'Les 3 premières secondes bougent peu. Ajoute du mouvement, un texte ou un plan marquant (estimation).', 10);
  else add('ok', 'Début dynamique', 'Les 3 premières secondes changent assez (estimation, pas un jugement sur le contenu).');

  // Son
  if (noTrack || (level !== null && level < 0.004)) add('bad', 'Pas de son détecté', 'Une vidéo muette retient moins. Ajoute une musique ou une voix.', 12);
  else if (level === null) add('info', 'Son non vérifié', 'Ton navigateur n’a pas pu analyser l’audio de cette vidéo.');
  else add('ok', 'Son présent', 'Un son est bien détecté.');

  // Texte et hashtags
  const text = caption.trim(), tags = (text.match(/#[\p{L}\p{N}_]+/gu) || []).length;
  if (!text) add('warn', 'Pas de texte', 'Ajoute une phrase d’accroche pour donner envie de regarder.', 6);
  else if (text.length > 300) add('warn', 'Texte long', `${text.length} caractères : va à l’essentiel, le début est le plus lu.`, 4);
  else add('ok', 'Texte de bonne longueur', `${text.length} caractères.`);
  if (text) {
    if (tags === 0) add('warn', 'Aucun hashtag', 'Ajoute 3 à 5 hashtags liés à ton sujet.', 3);
    else if (tags > 8) add('warn', 'Trop de hashtags', `${tags} hashtags : 3 à 5 bien choisis suffisent.`, 5);
    else add('ok', 'Hashtags corrects', `${tags} hashtag(s).`);
  }

  const score = Math.max(0, 100 - c.reduce((s, x) => s + x.pen, 0));
  return { c, score };
}

// Comparaison avec les publications de la Page (via l'API du site)
async function compare() {
  let pw = ''; try { pw = localStorage.getItem('pwd') || ''; } catch {}
  if (!pw) return '<p class="meta">Entre ton mot de passe dans la page Publier pour comparer avec tes publications.</p>';
  const r = await fetch('/api/stats', { headers: { 'x-password': pw } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) return `<p class="meta">Comparaison indisponible : ${esc(d.error || 'erreur')}</p>`;
  const posts = (d.posts || []).filter((p) => p.views != null);
  if (posts.length < 4) return '<p class="meta">Pas encore assez de publications pour comparer.</p>';
  const med = (a) => { const s = a.map((p) => p.views).sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : null; };
  const g = { 'Vidéos': posts.filter((p) => p.video), 'Photos': posts.filter((p) => p.image && !p.video), 'Texte seul': posts.filter((p) => !p.video && !p.image) };
  const rows = Object.entries(g).filter(([, a]) => a.length).map(([n, a]) => `<div class="row info"><b>${n}</b>Vues médianes : ${med(a).toLocaleString('fr-FR')} (sur ${a.length} publication${a.length > 1 ? 's' : ''})</div>`).join('');
  const top = [...posts].sort((a, b) => b.views - a.views).slice(0, 3).map((p) => new Date(p.created).getHours());
  return rows + `<div class="row info"><b>Heures de tes meilleures publications</b>Vers ${top.map((h) => h + ' h').join(', ')}</div>`;
}

const VERDICT = (s) => s >= 80 ? 'Prête à publier' : s >= 60 ? 'À améliorer avant de publier' : 'À revoir avant de publier';
const ICON = { ok: '✔ OK', warn: '⚠ À améliorer', bad: '✖ Problème', info: 'ℹ Info' };

go.addEventListener('click', async () => {
  const f = file.files[0];
  if (!f) { out.innerHTML = '<p class="err">Choisis d’abord une vidéo.</p>'; return; }
  go.disabled = true; out.innerHTML = '<p class="meta">Analyse en cours…</p>';
  try {
    const { c, score } = await analyse(f, cap.value);
    let cmp = ''; try { cmp = await compare(); } catch { cmp = '<p class="meta">Comparaison indisponible.</p>'; }
    out.innerHTML = `<div class="score"><strong>${score}/100</strong><span>${VERDICT(score)}</span></div>
      <div class="meter" aria-hidden="true"><i style="width:${score}%"></i></div>
      <p class="meta">Ce score repère les erreurs courantes. Il ne garantit pas les vues.</p>
      <h2>Contrôles</h2>${c.map((x) => `<div class="row ${x.st}"><b>${ICON[x.st]} · ${esc(x.t)}</b>${esc(x.d)}</div>`).join('')}
      <h2>Avec tes publications</h2>${cmp}
      <a class="go" href="/#publish">Publier cette vidéo →</a>`;
  } catch (e) {
    out.innerHTML = `<p class="err">${esc(e.message)}</p>`;
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
